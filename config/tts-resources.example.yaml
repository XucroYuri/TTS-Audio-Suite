# Copy this file to the location named by TTS_AUDIO_SUITE_RESOURCES, then replace
# the documentation-only paths below with directories and weights on this machine.
version: 1
resources:
  local-gpt-sovits:
    engine: gpt_sovits
    version: v2
    source_root: C:/tts-resources/GPT-SoVITS
    gpt_weight: C:/tts-resources/GPT-SoVITS/GPT_weights/voice.ckpt
    sovits_weight: C:/tts-resources/GPT-SoVITS/SoVITS_weights/voice.pth
    bert_path: C:/tts-resources/GPT-SoVITS/GPT_SoVITS/pretrained_models/chinese-roberta-wwm-ext-large
    cnhubert_path: C:/tts-resources/GPT-SoVITS/GPT_SoVITS/pretrained_models/chinese-hubert-base
  local-index-tts:
    engine: index_tts
    source_root: C:/tts-resources/IndexTTS
    model_dir: C:/tts-resources/IndexTTS/checkpoints
  local-cosyvoice:
    engine: cosyvoice
    source_root: C:/tts-resources/CosyVoice
    model_dir: C:/tts-resources/CosyVoice/pretrained_models/CosyVoice-300M
    # Optional: an absolute regular interpreter file for an isolated CosyVoice runtime.
    # It may live outside source_root; reparse-point paths are rejected.
    # python_executable: F:/tts-runtimes/cosyvoice/python.exe
