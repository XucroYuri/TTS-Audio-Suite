name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev-xu/comfyui-api-bridge]

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: >-
          python -m pip install pytest pyyaml soundfile numpy requests
          huggingface_hub
      - name: Install PyTorch CPU dependencies
        run: >-
          python -m pip install torch torchaudio
          --index-url https://download.pytorch.org/whl/cpu
      - name: Run unit tests
        env:
          COMFYUI_TESTING: "1"
        run: python -m pytest tests/unit -q
